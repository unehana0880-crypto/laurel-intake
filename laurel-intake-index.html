<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4EF">
<meta name="robots" content="noindex, nofollow">
<title>Laurel Studio — 사전 접수</title>
<style>
  :root{
    --bg:#F7F4EF; --card:#FFFFFF; --line:#E4DED2; --line2:#CFC6B4;
    --ink:#241F17; --ink2:#5C5345; --muted:#8C8171;
    --gold:#A8833F; --goldbg:#FBF5E8;
    --green:#2F6B45; --greenbg:#E9F3EC;
    --red:#B4453F; --redbg:#FBECEA;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{background:var(--bg);overflow-x:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;
    color:var(--ink); font-size:19px; line-height:1.65;
    min-height:100vh; padding:env(safe-area-inset-top) 0 120px;
  }
  .wrap{max-width:620px;margin:0 auto;padding:0 20px}

  /* ── 머리 ── */
  .top{text-align:center;padding:26px 0 10px}
  .top.hide + #prog{margin-top:0}
  .brand{font-size:12px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase}
  .bar{height:6px;background:var(--line);border-radius:99px;margin:16px 0 6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
  .barlbl{font-size:14px;color:var(--muted);text-align:center;margin-bottom:18px;direction:ltr}

  /* ── 카드 ── */
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px;margin-bottom:18px}
  h1{font-size:27px;line-height:1.4;font-weight:700;margin-bottom:10px;letter-spacing:-.01em}
  h2{font-size:24px;line-height:1.45;font-weight:700;margin-bottom:8px;letter-spacing:-.01em}
  .sub{font-size:17px;color:var(--ink2);line-height:1.7;margin-bottom:20px}
  .note{font-size:16px;color:var(--muted);line-height:1.7;margin-top:14px}

  /* ── 큰 버튼 목록 ── */
  .opts{display:flex;flex-direction:column;gap:11px}
  .opt{
    display:flex;align-items:center;gap:14px;width:100%;
    min-height:68px;padding:16px 18px;
    border:2px solid var(--line);border-radius:14px;background:#fff;
    font-family:inherit;font-size:19px;line-height:1.45;color:var(--ink);
    text-align:start;cursor:pointer;transition:border-color .12s,background .12s;
  }
  .opt .mark{
    flex:0 0 28px;width:28px;height:28px;border-radius:50%;
    border:2px solid var(--line2);background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:17px;color:#fff;font-weight:700;
  }
  .opt.sq .mark{border-radius:8px}
  .opt.on{border-color:var(--gold);background:var(--goldbg)}
  .opt.on .mark{background:var(--gold);border-color:var(--gold)}
  .opt.on .txt{font-weight:600}
  .opt .txt{flex:1}
  .opt.dk{border-style:dashed}
  .opt.dk.on{border-style:solid}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .grid2 .opt{min-height:62px;font-size:18px}
  .glabel{font-size:17px;font-weight:700;color:var(--ink2);margin:22px 0 10px}
  .glabel:first-child{margin-top:0}

  /* ── 입력칸 ── */
  input[type=text],input[type=email],input[type=date],textarea{
    width:100%;padding:17px 16px;border:2px solid var(--line);border-radius:13px;
    background:#fff;font-family:inherit;font-size:20px;color:var(--ink);line-height:1.5;
  }
  input:focus,textarea:focus{outline:none;border-color:var(--gold)}
  textarea{min-height:110px;resize:vertical}
  .ilabel{font-size:17px;font-weight:700;margin-bottom:9px;display:block}
  .ihint{font-size:15px;color:var(--muted);margin-top:8px;line-height:1.6}
  .fld{margin-bottom:20px}
  .fld:last-child{margin-bottom:0}

  .match{margin-top:10px;font-size:17px;font-weight:700;min-height:26px;display:flex;align-items:center;gap:7px}
  .match.ok{color:var(--green)}
  .match.no{color:var(--red)}

  .err{background:var(--redbg);border-inline-start:4px solid var(--red);border-radius:0 10px 10px 0;
       padding:13px 15px;margin-top:14px;font-size:17px;color:var(--red);font-weight:600;line-height:1.6}

  /* ── 안심 문구 ── */
  .calm{background:var(--goldbg);border:2px solid #EADFC4;border-radius:16px;padding:22px 20px;margin-bottom:20px}
  .calm > b{display:block;font-size:21px;font-weight:700;margin-bottom:10px;color:var(--ink)}
  .calm p b{font-weight:700;color:var(--ink)}
  .calm p{font-size:18px;line-height:1.75;color:var(--ink2);margin-bottom:9px}
  .calm p:last-child{margin-bottom:0}

  /* ── 아래 고정 단추 ── */
  .foot{position:fixed;left:0;right:0;bottom:0;background:rgba(247,244,239,.97);
        border-top:1px solid var(--line);padding:14px 20px calc(14px + env(safe-area-inset-bottom));
        display:flex;gap:11px;justify-content:center;backdrop-filter:blur(6px);z-index:30}
  .foot .in{max-width:620px;width:100%;display:flex;gap:11px}
  .btn{flex:1;min-height:64px;border:none;border-radius:14px;font-family:inherit;
       font-size:21px;font-weight:700;cursor:pointer;padding:0 18px}
  .btn-next{background:var(--ink);color:#fff}
  .btn-next[disabled]{background:#CFC9BE;color:#fff}
  .btn-back{flex:0 0 108px;background:#fff;border:2px solid var(--line);color:var(--ink2);font-size:18px}

  /* ── 언어 고르기 ── */
  /* 첫 화면은 한 쪽(page)처럼 — 위아래 여백을 같게 두고 언어는 한가운데 */
  body.langmode{padding:0}
  .langpage{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
            padding-top:calc(env(safe-area-inset-top) + 36px);
            padding-bottom:calc(env(safe-area-inset-bottom) + 36px)}
  .langhead{text-align:center;margin:0 0 28px}
  .langhead .t{font-family:Georgia,'Times New Roman',Times,serif;
               font-size:clamp(24px,6.8vw,32px);font-weight:400;letter-spacing:.1em;
               line-height:1.5;color:var(--ink)}
  .langhead .u{width:46px;height:1px;background:var(--line2);margin:24px auto 0}
  /* 책의 판권지처럼 — 맨 아래 조용히 */
  .colophon{text-align:center;margin:28px 0 0}
  .colophon .r{width:28px;height:1px;background:var(--line);margin:0 auto 16px}
  .colophon .n{font-size:11px;letter-spacing:.34em;color:var(--muted);text-transform:uppercase}
  .langgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:auto 0}
  .langbtn{min-height:92px;border:2px solid var(--line);border-radius:16px;background:#fff;
           font-family:inherit;cursor:pointer;padding:12px 6px;
           display:flex;align-items:center;justify-content:center;text-align:center;
           font-size:clamp(19px,5.4vw,25px);font-weight:700;color:var(--ink);line-height:1.25;
           letter-spacing:.01em;word-break:keep-all;overflow-wrap:anywhere;
           transition:border-color .12s,background .12s}
  .langbtn:active{border-color:var(--gold);background:var(--goldbg)}

  /* ── 끝인사 ── */
  .after{background:var(--goldbg);border:2px solid #EADFC4;border-radius:16px;
         padding:20px 18px;margin-top:20px;text-align:start}
  .after .ah{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:12px;line-height:1.5}
  .after ul{list-style:none;padding:0;margin:0}
  .after li{font-size:17.5px;color:var(--ink2);line-height:1.6;padding:7px 0 7px 26px;position:relative}
  [dir=rtl] .after li{padding:7px 26px 7px 0}
  .after li:before{content:'·';position:absolute;inset-inline-start:8px;color:var(--gold);
                   font-size:24px;line-height:1.2;font-weight:700}
  .trust{border:2px solid var(--line);border-radius:16px;padding:20px 18px;margin-top:14px;
         text-align:start;font-size:17.5px;line-height:1.75;color:var(--ink2);background:#fff}
  .trust b{color:var(--ink)}
  .trust .see{display:block;margin-top:12px;font-size:19px;font-weight:700;color:var(--ink)}

  /* ── 완료 ── */
  .done{text-align:center;padding:14px 0}
  .done .big{font-size:58px;margin-bottom:14px}
  .done h1{font-size:30px}
  .idbox{margin:22px auto 0;max-width:340px;background:var(--goldbg);
         border:2px solid #EADFC4;border-radius:14px;padding:18px}
  .idbox .k{font-size:13px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;font-weight:700}
  .idbox .v{font-size:25px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
            color:var(--ink);margin-top:7px;word-break:break-all}
  .idbox .n{font-size:16px;color:var(--ink2);margin-top:7px}
  .saving{font-size:17px;color:var(--muted);margin-top:16px;min-height:26px}

  [dir=rtl] .opt{text-align:right}
  .hide{display:none !important}

  @media (max-width:360px){
    body{font-size:18px}
    h1{font-size:24px} h2{font-size:22px}
    .opt{font-size:18px;min-height:64px}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="top" id="brandTop">
    <div class="brand">Laurel Studio</div>
  </div>

  <div id="prog" class="hide">

    <div class="barlbl" id="barlbl"></div>
  </div>

  <div id="screen"></div>
</div>

<div class="foot hide" id="foot">
  <div class="in">
    <button class="btn btn-back hide" id="btnBack" onclick="go(-1)">←</button>
    <button class="btn btn-next" id="btnNext" onclick="go(1)">다음</button>

</div>

/* ═══════════ 주소에 실려 온 정보 ═══════════ */
var Q = (function(){
  var o = {};
  (location.search || "").replace(/^\?/,"").split("&").forEach(function(kv){
    if(!kv) return;
    var i = kv.indexOf("=");
    var k = i<0 ? kv : kv.slice(0,i);
    var v = i<0 ? "" : decodeURIComponent(kv.slice(i+1).replace(/\+/g," "));
    o[k] = v;
  });
  return o;
})();
var FIXED_DATE = /^\d{4}-\d{2}-\d{2}$/.test(Q.d || "") ? Q.d : null;   /* ?d=2026-11-02 */
var GROUP      = (Q.g || "").slice(0,40);                              /* ?g=스페인12 */

/* ═══════════ 상태 ═══════════ */
var lang = null, step = 0, sending = false, doneCaseId = null;
var D = {
  name:"", date:FIXED_DATE || "", email:"", email2:"",
  gender:null, age:null, wash:null, washDk:false,
  concerns:[], conNone:false, conDk:false,
  algNone:false, algText:"", agree:false
};
/* 「세수 30분 뒤」 → 기존 피부타입 칸으로 옮기는 표 */
var WASH2SKIN = [1, 0, 2, 3, 4];   /* 당김→건성 · 번들→지성 · T존→복합 · 빨개짐→민감 · 무감→정상 */

function t(){ return T[lang] || T.en; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function $(id){ return document.getElementById(id); }

/* ═══════════ 화면 차례 ═══════════ */
function steps(){
  var s = ["calm","name","mail","who","wash","con","alg","ok"];
  return s;
}
function lastStep(){ return steps().length - 1; }

/* ═══════════ 언어 고르기 ═══════════ */
function renderLang(){
  $("prog").classList.add("hide");
  $("foot").classList.add("hide");
  $("brandTop").classList.add("hide");     /* 이름은 맨 아래로 내립니다 */
  document.documentElement.lang = "ko";
  document.body.removeAttribute("dir");
  document.body.classList.add("langmode");
  $("screen").innerHTML =
    '<div class="langpage">' +
      '<div class="langhead"><div class="t">CHOOSE YOUR LANGUAGE</div><div class="u"></div></div>' +
      '<div class="langgrid">' +
      LANGS.map(function(L){
        return '<button class="langbtn" lang="'+L[0]+'"'+(RTL[L[0]]?' dir="rtl"':'')+
               ' onclick="pickLang(\''+L[0]+'\')">'+esc(L[1])+'</button>';
      }).join("") +
      '</div>' +
      '<div class="colophon"><div class="r"></div><div class="n">Laurel Studio</div></div>' +
    '</div>';
}
window.pickLang = function(code){
  lang = code;
  document.body.classList.remove("langmode");
  $("brandTop").classList.remove("hide");
  document.documentElement.lang = code;
  if (RTL[code]) document.body.setAttribute("dir","rtl");
  else document.body.removeAttribute("dir");
  step = 0;
  render();
};

/* ═══════════ 공통 조각 ═══════════ */
function optBtn(on, label, handler, square, dashed){
  return '<button class="opt'+(square?' sq':'')+(dashed?' dk':'')+(on?' on':'')+'" onclick="'+handler+'">' +
           '<span class="mark">'+(on?'✓':'')+'</span><span class="txt">'+label+'</span></button>';
}

/* ═══════════ 각 화면 ═══════════ */
function render(){
  var L = t(), s = steps()[step], h = "";

  $("prog").classList.remove("hide");
  $("foot").classList.remove("hide");
  var pct = Math.round((step) / lastStep() * 100);
  $("barfill").style.width = pct + "%";
  $("barlbl").textContent = (step+1) + " / " + (lastStep()+1);
  $("btnBack").classList.toggle("hide", step === 0);
  $("btnBack").textContent = L.back;
  $("btnNext").textContent = (s === "ok") ? L.submit : (s === "calm" ? L.start : L.next);
  $("btnNext").disabled = false;

  if (s === "calm"){
    h = '<div class="calm">' +
          '<b>'+L.calmTitle+'</b>' +
          '<p>'+L.calm1+'</p><p>'+L.calm2+'</p><p>'+L.calm3+'</p>' +
        '</div>';
  }

  else if (s === "name"){
    h = '<div class="card"><h2>'+L.qName+'</h2><div class="sub">'+L.qNameSub+'</div>' +
        '<div class="fld"><input type="text" id="f-name" value="'+esc(D.name)+'" placeholder="'+esc(L.namePh)+'" ' +
        'autocomplete="name" oninput="D.name=this.value"></div></div>';
    if (!FIXED_DATE){
      h += '<div class="card"><h2>'+L.qWhen+'</h2><div class="opts">' +
           optBtn(D.date===dPlus(0), L.whenToday, "setWhen(0)") +
           optBtn(D.date===dPlus(1), L.whenTom,   "setWhen(1)") +
           optBtn(D.date===dPlus(2), L.whenDay,   "setWhen(2)") +
           '</div><div class="fld" style="margin-top:14px">' +
           '<label class="ilabel">'+L.whenPick+'</label>' +
           '<input type="date" id="f-date" value="'+esc(D.date)+'" onchange="D.date=this.value;render()"></div></div>';
    }
  }

  else if (s === "mail"){
    h = '<div class="card"><h2>'+L.qMail+'</h2><div class="sub">'+L.qMailSub+'</div>' +
        '<div class="fld"><label class="ilabel">'+L.mail1+'</label>' +
        '<input type="email" id="f-m1" value="'+esc(D.email)+'" placeholder="example@email.com" ' +
        'inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" ' +
        'oninput="D.email=this.value.trim();paintMail()"></div>' +
        '<div class="fld"><label class="ilabel">'+L.mail2+'</label>' +
        '<input type="email" id="f-m2" value="'+esc(D.email2)+'" placeholder="example@email.com" ' +
        'inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false" ' +
        'onpaste="return false" oninput="D.email2=this.value.trim();paintMail()">' +
        '<div class="match" id="m-match"></div></div>' +
        '<div class="note">'+L.mailHint+'</div></div>';
  }

  else if (s === "who"){
    h = '<div class="card"><h2>'+L.qWho+'</h2><div class="sub">'+L.qWhoSub+'</div>' +
        '<div class="glabel">'+L.lGender+'</div><div class="grid2">' +
        L.genderOpts.map(function(g,i){ return optBtn(D.gender===i, esc(g), "setG("+i+")"); }).join("") +
        '</div>' +
        '<div class="glabel">'+L.lAge+'</div><div class="grid2">' +
        L.ageOpts.map(function(a,i){ return optBtn(D.age===i, esc(a), "setA("+i+")"); }).join("") +
        '</div></div>';
  }

  else if (s === "wash"){
    h = '<div class="card"><h2>'+L.qWash+'</h2><div class="sub">'+L.qWashSub+'</div><div class="opts">' +
        L.washOpts.map(function(w,i){ return optBtn(!D.washDk && D.wash===i, esc(w), "setW("+i+")"); }).join("") +
        optBtn(D.washDk, esc(L.dk), "setW(-1)", false, true) +
        '</div></div>';
  }

  else if (s === "con"){
    h = '<div class="card"><h2>'+L.qCon+'</h2><div class="sub">'+L.qConSub+'</div><div class="opts">' +
        L.concernOpts.map(function(c,i){
          return optBtn(D.concerns.indexOf(i)>-1, esc(c), "toggleC("+i+")", true);
        }).join("") +
        optBtn(D.conNone, esc(L.none), "setCNone()", true, true) +
        optBtn(D.conDk,   esc(L.dk),   "setCDk()",   true, true) +
        '</div></div>';
  }

  else if (s === "alg"){
    h = '<div class="card"><h2>'+L.qAlg+'</h2><div class="sub">'+L.qAlgSub+'</div><div class="opts">' +
        optBtn(D.algNone, esc(L.algNone), "setAlgNone()", true, true) +
        '</div>' +
        '<div class="fld" style="margin-top:16px">' +
        '<textarea id="f-alg" placeholder="'+esc(L.algPh)+'" oninput="D.algText=this.value;if(this.value)D.algNone=false;paintAlg()">'+esc(D.algText)+'</textarea>' +
        '</div></div>';
  }

  else if (s === "ok"){
    h = '<div class="card"><h2>'+L.qOk+'</h2>' +
        '<div class="sub">'+L.okBody+'</div><div class="opts">' +
        optBtn(D.agree, esc(L.okAgree), "setAgree()", true) +
        '</div><div class="saving" id="sendmsg"></div></div>';
  }

  $("screen").innerHTML = h;
  if (s === "mail") paintMail();
  if (s === "alg")  paintAlg();
  window.scrollTo(0,0);
}

/* ═══════════ 고르기 ═══════════ */
function dPlus(n){
  var d = new Date(); d.setDate(d.getDate()+n);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
window.setWhen = function(n){ D.date = dPlus(n); render(); };
window.setG = function(i){ D.gender = (D.gender===i ? null : i); render(); };
window.setA = function(i){ D.age    = (D.age===i    ? null : i); render(); };
window.setW = function(i){
  if (i === -1){ D.washDk = !D.washDk; if(D.washDk) D.wash = null; }
  else { D.wash = (D.wash===i ? null : i); D.washDk = false; }
  render();
};
window.toggleC = function(i){
  var k = D.concerns.indexOf(i);
  if (k>-1) D.concerns.splice(k,1); else D.concerns.push(i);
  if (D.concerns.length){ D.conNone = false; D.conDk = false; }
  render();
};
window.setCNone = function(){ D.conNone = !D.conNone; if(D.conNone){ D.concerns=[]; D.conDk=false; } render(); };
window.setCDk   = function(){ D.conDk   = !D.conDk;   if(D.conDk){   D.concerns=[]; D.conNone=false; } render(); };
window.setAlgNone = function(){ D.algNone = !D.algNone; if(D.algNone) D.algText=""; render(); };
window.setAgree = function(){ D.agree = !D.agree; render(); };

function paintAlg(){
  var el = $("f-alg"); if(!el) return;
  el.style.opacity = D.algNone ? ".45" : "1";
}

function mailValid(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v); }
function paintMail(){
  var L = t(), el = $("m-match"); if(!el) return;
  var a = D.email, b = D.email2;
  if (!a && !b){ el.className="match"; el.textContent=""; return; }
  if (a && !mailValid(a)){ el.className="match no"; el.textContent="✕ " + L.mailBad; return; }
  if (!b){ el.className="match"; el.textContent=""; return; }
  if (a.toLowerCase() === b.toLowerCase()){ el.className="match ok"; el.textContent="✓ " + L.mailOk; }
  else { el.className="match no"; el.textContent="✕ " + L.mailNo; }
}

/* ═══════════ 앞뒤로 ═══════════ */
window.go = function(dir){
  var L = t(), s = steps()[step];
  if (dir > 0){
    if (s === "name"){
      if (!D.name.trim()){ bump(L.errName); return; }
      if (!D.date) D.date = dPlus(0);
    }
    if (s === "mail"){
      if (!mailValid(D.email) || D.email.toLowerCase() !== D.email2.toLowerCase()){ bump(L.errMail); return; }
    }
    if (s === "ok"){
      if (!D.agree){ bump(L.errOk); return; }
      submit(); return;
    }
    step = Math.min(step+1, lastStep());
  } else {
    step = Math.max(step-1, 0);
  }
  render();
};
function bump(msg){
  var box = document.querySelector(".card:last-of-type") || $("screen");
  var old = document.querySelector(".err"); if(old) old.remove();
  var d = document.createElement("div");
  d.className = "err"; d.textContent = msg;
  box.appendChild(d);
  d.scrollIntoView({block:"center", behavior:"smooth"});
}

/* ═══════════ 보내기 ═══════════ */
function buildPayload(){
  var K = T.ko;   /* 시트에는 항상 한국어로 적습니다 */
  var now = new Date();
  var ds = now.getFullYear() + String(now.getMonth()+1).padStart(2,"0") + String(now.getDate()).padStart(2,"0");
  if (!doneCaseId) doneCaseId = "CR-" + ds + "-" + String(Date.now()).slice(-4);

  var skin = (!D.washDk && D.wash !== null) ? K.skintypeOpts[WASH2SKIN[D.wash]] : "";
  var cons = D.concerns.map(function(i){ return K.concernOpts[i]; }).join("|");

  var memo = [];
  if (D.algNone) memo.push("알러지: 없음");
  else if (D.algText.trim()) memo.push("알러지·주의: " + D.algText.trim());
  if (D.conDk)  memo.push("[고민: 잘 모르겠다고 답함]");
  if (D.conNone) memo.push("[고민: 해당 없음]");
  if (D.washDk) memo.push("[피부타입: 잘 모르겠다고 답함 — 테라피스트 확인 필요]");
  if (GROUP) memo.push("[단체: " + GROUP + "]");
  memo.push("[사전접수 · 언어 " + lang + "]");

  return {
    case_id: doneCaseId,
    section: "CARE",
    saved_at: now.toISOString(),
    client_name: D.name.trim(),
    client_email: D.email.trim(),
    visit_date: D.date || dPlus(0),
    therapist_name: "",
    visit_count: "1회차 (신규)",
    gender: D.gender !== null ? K.genderOpts[D.gender] : "",
    age_group: D.age !== null ? K.ageOpts[D.age] : "",
    client_skintype: skin,
    client_concerns: cons,
    client_goals: "",
    client_memo: memo.join("\n"),
    program: "",
    source: GROUP ? "단체 사전접수" : "사전접수"
  };
}

function callSheet(payload, tries){
  tries = tries || 3;
  var attempt = 0;
  function once(){
    attempt++;
    var ctl = ("AbortController" in window) ? new AbortController() : null;
    var timer = setTimeout(function(){ if(ctl) ctl.abort(); }, 35000);
    return fetch(WEBHOOK, {
      method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      signal: ctl ? ctl.signal : undefined,
      redirect:"follow"
    }).then(function(r){ clearTimeout(timer); return r.json(); })
      .catch(function(e){
        clearTimeout(timer);
        if (attempt < tries){
          return new Promise(function(res){ setTimeout(res, attempt*1800); }).then(once);
        }
        throw e;
      });
  }
  return once();
}

function submit(){
  if (sending) return;
  sending = true;
  var L = t();
  $("btnNext").disabled = true;
  var msg = $("sendmsg"); if (msg) msg.textContent = L.saving;

  callSheet(buildPayload()).then(function(res){
    sending = false;
    if (res && (res.status === "ok" || res.status === "success")) showDone();
    else showFail();
  }).catch(function(){
    sending = false;
    showFail();
  });
}

function showDone(){
  var L = t();
  $("prog").classList.add("hide");
  $("foot").classList.add("hide");
  $("screen").innerHTML =
    '<div class="card done">' +
      '<div class="big">✨</div>' +
      '<h1>'+L.savedT+'</h1>' +
      '<div class="sub" style="margin-top:10px">'+L.savedB+'</div>' +
      '<div class="idbox"><div class="k">'+L.idLabel+'</div>' +
      '<div class="v">'+esc(doneCaseId)+'</div>' +
      '<div class="n">'+esc(D.name)+'</div></div>' +
      '<div class="after"><div class="ah">'+L.afterT+'</div><ul>' +
        L.aList.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join("") +
      '</ul></div>' +
      '<div class="trust">'+L.trust+'<span class="see">'+esc(L.see)+'</span></div>' +
    '</div>';
  window.scrollTo(0,0);
}
function showFail(){
  var L = t();
  $("btnNext").disabled = false;
  $("btnNext").textContent = L.retry;
  var msg = $("sendmsg");
  if (msg){
    msg.innerHTML = '<span style="color:var(--red);font-weight:700">' + esc(L.failT) + '</span><br>' + esc(L.failB);
  }
}

/* ═══════════ 시작 ═══════════ */
renderLang();
</script>
